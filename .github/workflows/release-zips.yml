# Один релиз = все ZIP + versions.json с версиями утилит.
# Триггер: gh release create v1.0.003 ...
# Панели проверяют updates через versions.json в assets.

name: Release ZIPs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract versions and create versions.json
        run: |
          mkdir -p out
          entries=""
          for dir in AETimeTracker SmartSyncAssetsCEP yandex-map-cleaner; do
            if [[ ! -d "$dir" ]]; then continue; fi
            ver="0.0.0"
            if [[ -f "$dir/CSXS/manifest.xml" ]]; then
              ver=$(sed -n 's/.*ExtensionBundleVersion="\([^"]*\)".*/\1/p' "$dir/CSXS/manifest.xml" | head -1)
            fi
            if [[ -z "$ver" || "$ver" == *"ExtensionBundleVersion"* ]] && [[ -f "$dir/manifest.json" ]]; then
              ver=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$dir/manifest.json" | head -1)
            fi
            [[ -z "$ver" ]] && ver="0.0.0"
            [[ -n "$entries" ]] && entries="$entries,"
            entries="$entries\"$dir\":\"$ver\""
          done
          echo "{$entries}" > out/versions.json
          cat out/versions.json

      - name: Create ZIPs and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for d in */; do
            name="${d%/}"
            [[ "$name" == .* ]] && continue
            [[ "$name" == "node_modules" ]] && continue
            [[ "$name" == "out" ]] && continue
            zip -r "${name}.zip" "$name"
          done
          cp out/versions.json .
          gh release upload "$TAG" *.zip versions.json --clobber
