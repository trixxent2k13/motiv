# Создаёт ZIP каждой утилиты и прикрепляет к релизу.
# Триггер: публикация релиза (Release → Create new release → Publish).
# ZIP-архивы появятся в Assets релиза.
# Если ошибка "Resource not accessible": Settings → Actions → General →
#   Workflow permissions → Read and write permissions.

name: Release ZIPs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create ZIP for each utility
        run: |
          for dir in */; do
            name="${dir%/}"
            # Пропускаем служебные папки
            [[ "$name" == .* ]] && continue
            [[ "$name" == "node_modules" ]] && continue
            zip -r "${name}.zip" "$name"
          done

      - name: Upload ZIPs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in *.zip; do
            gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
          done
