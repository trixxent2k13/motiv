# Создаёт ZIP и прикрепляет к релизу.
# Формат тега: UtilityName-v1.0.001 — зипуется только эта папка.
# Легаси (v1.0 без префикса) — зипуются все папки.
# Триггер: gh release create AETimeTracker-v1.0.002 ...

name: Release ZIPs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create and upload ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ ^([A-Za-z0-9_-]+)-v[0-9] ]]; then
            dir="${BASH_REMATCH[1]}"
            if [[ -d "$dir" ]] && [[ "$dir" != ".github" ]]; then
              zip -r "${dir}.zip" "$dir"
              gh release upload "$TAG" "${dir}.zip" --clobber
              echo "Uploaded ${dir}.zip for $TAG"
            else
              echo "Folder $dir not found"
              exit 1
            fi
          else
            for d in */; do
              name="${d%/}"
              [[ "$name" == .* ]] && continue
              [[ "$name" == "node_modules" ]] && continue
              zip -r "${name}.zip" "$name"
              gh release upload "$TAG" "${name}.zip" --clobber
            done
          fi
